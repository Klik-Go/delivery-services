name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (Vitest + coverage)
        run: pnpm test:unit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Supabase · build · Cucumber · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local Supabase only; these are the CLI's fixed local defaults, not secrets.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BASE_URL: http://localhost:3000
      # Deterministic menu reader for AI-import tests; Gemini is never called from CI.
      MENU_PARSER: fake
      # Turns on the pre-launch placeholder sign-in for features/auth/placeholder-otp.feature.
      # A test-only value: production's code lives only in Vercel (OPEN_QUESTIONS Q20).
      PLACEHOLDER_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Generate a throwaway Send-SMS hook secret
        # Shared by Supabase Auth (config.toml env(SEND_SMS_HOOK_SECRET)) and the web app for this run only.
        run: |
          secret="v1,whsec_$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "SEND_SMS_HOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Supabase start
        # Services we do not use yet are excluded to keep CI fast; add them back as phases need them.
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Supabase migrate (db reset applies every migration + seed)
        run: pnpm exec supabase db reset
      - name: Export the local Supabase URL and keys
        # The local stack's keys are the CLI's fixed development defaults; masked anyway.
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          service="$(value SERVICE_ROLE_KEY)"
          echo "::add-mask::$service"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(value ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase.env"

      - name: Database and repository tests (RLS isolation, PostGIS, integrity, Prisma repositories)
        run: pnpm test:db
      - name: Prisma schema and ERD match the migrated database
        run: |
          pnpm --filter @klikgo/db db:check
          pnpm --filter @klikgo/db db:erd:check

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @klikgo/web exec playwright install --with-deps chromium

      - name: Start web server
        run: |
          pnpm --filter @klikgo/web start > web-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$BASE_URL/api/health" > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become healthy" && cat web-server.log && exit 1

      - name: Cucumber (BDD, incl. @db and @auth against Supabase Auth)
        run: pnpm test:bdd
      - name: Playwright (Pixel 7 + desktop)
        run: pnpm test:e2e
      - name: Lighthouse budget (mobile; store page performance >= 85)
        run: pnpm lighthouse

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            lighthouse-report/
          retention-days: 14
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: reports/
          retention-days: 14
      - name: Server log
        if: failure()
        run: cat web-server.log || true
      - name: Supabase stop
        if: always()
        run: pnpm exec supabase stop --no-backup || true
