name: Load demo riders

# Manual only. Loads (or hides) the demo riders on the hosted project with scripts/demo-riders.ts:
# 10 invented riders across Makati, San Fernando and San Marcelino (approved and online near the
# demo stores, off shift, waiting for KYC review with placeholder PDFs, suspended, one on the
# coaching list). Their numbers are test numbers (+63 917 000 0901 … 0910): add them under
# Supabase → Authentication → Phone → Test phone numbers and OTPs so they can sign in without SMS.
# Safe to run again; `load` also puts the KYC demo back to "waiting for review". `hide` takes them
# offline and suspends them (history is kept). docs/DEMO.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "load: add or reset the demo riders; hide: take them off shift and suspend them"
        required: true
        default: load
        type: choice
        options: [load, hide]

permissions:
  contents: read

concurrency:
  group: demo-data
  cancel-in-progress: false

jobs:
  demo:
    name: Load or hide the demo riders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same gate as database deploys: a required reviewer here approves each run.
    environment: production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Inputs reach the shell only as environment variables, never as inline expressions.
      DEMO_ACTION: ${{ inputs.action }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for name in SUPABASE_PROJECT_REF SUPABASE_SERVICE_ROLE_KEY DATABASE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (docs/OPEN_QUESTIONS.md Q13)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Load or hide the demo riders
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co"
          pnpm demo:riders
      - name: Next steps
        if: inputs.action == 'load'
        run: |
          echo "::notice::Add the printed numbers as Supabase test phone numbers (Authentication → Phone), then sign in at /auth/sign-in with a number and its code. Load the demo stores too (Load demo data) so online riders get offers. docs/DEMO.md."
