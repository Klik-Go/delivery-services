name: Deploy database migrations

# Applies supabase/migrations to the hosted Supabase project after they merge to main, so the
# hosted database never falls behind the app Vercel deploys (that drift made PUT /api/location
# return 500 on 2026-11-05). Seed data is never pushed. Needs three repository (or "production"
# environment) secrets; until they exist the job only warns. docs/OPEN_QUESTIONS.md Q13.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push (hosted project)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lets the owner require an approval before production schema changes (Settings → Environments).
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the hosted project secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF to deploy migrations (docs/OPEN_QUESTIONS.md Q13). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: ./.github/actions/setup
        if: steps.secrets.outputs.ready == 'true'
      - name: Throwaway Send-SMS hook secret for config parsing
        # The CLI validates supabase/config.toml (auth.hook.send_sms.secrets = env(...)) before
        # pushing. `db push` applies migrations only and never uploads auth settings, so a random,
        # correctly formatted value is enough; the project's real hook secret is untouched.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          secret="v1,whsec_$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "SEND_SMS_HOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Migrations that will be applied
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --skip-vault --dry-run
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --skip-vault
