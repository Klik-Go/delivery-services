name: Load test

# k6 lunch peak at 5x the expected pilot peak against the production build and a local Supabase
# (docs/runbooks/LOAD_TEST.md). Passes only with p95 < 500 ms and no failed requests.
on:
  pull_request:
    paths:
      - "load/**"
      - ".github/workflows/load-test.yml"
  schedule:
    - cron: "13 19 * * 0" # Mondays 03:13 Asia/Manila
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to hold the peak (minutes)"
        default: "5"

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lunch-peak:
    name: k6 lunch peak (5x pilot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local Supabase only; these are the CLI's fixed local defaults, not secrets.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BASE_URL: http://localhost:3000
      MENU_PARSER: fake
      PAYMENT_GATEWAY: fake
      PLACEHOLDER_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate throwaway secrets for this run
        run: |
          for name in SEND_SMS_HOOK_SECRET PAYMONGO_WEBHOOK_SECRET CRON_SECRET; do
            case "$name" in
              SEND_SMS_HOOK_SECRET) value="v1,whsec_$(openssl rand -base64 32)" ;;
              PAYMONGO_WEBHOOK_SECRET) value="whsk_test_$(openssl rand -hex 24)" ;;
              *) value="$(openssl rand -hex 32)" ;;
            esac
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Supabase start and seed
        run: |
          pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
          pnpm exec supabase db reset
      - name: Export the local Supabase URL and keys
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          service="$(value SERVICE_ROLE_KEY)"
          echo "::add-mask::$service"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(value ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase.env"
      - name: Build and start
        run: |
          pnpm build
          pnpm --filter @klikgo/web start > web-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS "$BASE_URL/api/health" > /dev/null && exit 0; sleep 1; done
          echo "Server did not become healthy" && cat web-server.log && exit 1
      - name: Prepare customers and the store owner
        run: node --import tsx load/prepare-sessions.ts 20
      - name: k6 run
        env:
          MINUTES: ${{ inputs.minutes || '5' }}
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a number"; exit 1 ;; esac
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD/load:/load" \
            -e BASE_URL -e CRON_SECRET -e MINUTES \
            grafana/k6:1.3.0 run --summary-export /load/summary.json /load/lunch-peak.js
      - name: Upload the k6 summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-summary
          path: load/summary.json
          if-no-files-found: ignore
      - name: Server log
        if: failure()
        run: tail -200 web-server.log || true
