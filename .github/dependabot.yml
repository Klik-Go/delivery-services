version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 10
    # pnpm 12 rejects versions younger than its minimumReleaseAge (1 day) in the lockfile;
    # waiting 2 days keeps Dependabot PRs installable and skips most bad releases.
    cooldown:
      default-days: 2
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
      # Majors arrive one package per PR so each migration is reviewed on its own (docs/OPEN_QUESTIONS.md Q2).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ["*"]
