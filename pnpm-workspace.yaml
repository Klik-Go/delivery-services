packages:
  - apps/*
  - packages/*

autoInstallPeers: true

# pnpm blocks dependency build scripts unless allowed here (supply-chain safety).
# true = run its install script; false = never (optional native helpers we do not need).
allowBuilds:
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": false
  "@tailwindcss/oxide": true
  esbuild: true
  prisma: true
  sharp: true
  supabase: true
  unrs-resolver: true
