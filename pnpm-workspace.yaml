packages:
  - apps/*
  - packages/*

autoInstallPeers: true

# pnpm blocks dependency build scripts unless allowed here (supply-chain safety).
# true = run its install script; false = never (optional native helpers we do not need).
allowBuilds:
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": false
  "@tailwindcss/oxide": true
  esbuild: true
  prisma: true
  sharp: true
  supabase: true
  unrs-resolver: true

# Security overrides for transitive dependencies (Phase 11 dependency audit). Exact, patched
# versions; remove each once the parent package ships the fix.
overrides:
  # GHSA-7589-6fvf-x4pw (high, ReDoS) via prisma > @prisma/config > effect.
  effect: 3.22.4
